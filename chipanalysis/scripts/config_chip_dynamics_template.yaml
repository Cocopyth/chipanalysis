# =============================================================================
# config_chip_dynamics_template.yaml
# =============================================================================
# Template configuration for batch_chip_dynamics.py
# Copy this file, fill in your model paths, and pass it with --config.
# =============================================================================

# ── Main-channel geometry (shared by all organisms) ───────────────────────────
# Preferred: "fourier_channel" uses BF periodicity + cross-correlation delay
# refinement and does not need the pillar U-Net.
# Legacy fallback: set method: "ml" to use model_path + U-Net pillar masks.
pillar:
  method:        fourier_channel

  fourier:
    target_period_um:              405.0
    expected_main_width_um:        450.0
    n_refinement_iters:            2
    orientation_period_tolerance_fraction: 1.0
    analysis_background_kernel_um: 300.0
    orientation_angle_method:      centroid
    delay_band_width_um:           200.0
    delay_margin_um:               80.0

  # Legacy ML fallback settings (used only with method: "ml")
  model_path:    ../models/unet_pillar_newchip.pth
  threshold:     0.5
  patch_size:    256
  patch_stride:  128
  min_obj_um2:   1000.0
  crop_cols:     500

# ── Common pipeline parameters ────────────────────────────────────────────────
timepoint_ref: 0
n_frames_mean: 10

# ── Per-organism detector configuration ───────────────────────────────────────
organisms:

  physarum:
    detector:       unet
    model_path:     ../models/unet_ppolycephalum_best_newchip.pth
    channel_key:    channel_bf
    unet_threshold: 0.5
    min_obj_um2:    100.0

  celegans:
    detector:       unet
    model_path:     ../models/unet_celegans_best_newchip.pth
    channel_key:    channel_bf
    unet_threshold: 0.5
    min_obj_um2:    1000.0

  dictyostelium:
    detector:            fluo_threshold
    channel_key:         channel_purple
    bg_sigma_um:         1000.0
    thresh_factor:       0.2
    min_obj_um2:         25.0
    max_hole_um2:        5.0
    calibrate_timepoint: 0

# ── Video export ──────────────────────────────────────────────────────────────
video:
  fps:           1         # frames per second
  width:         4096      # output frame width in pixels (height is auto)
  dpi:           150       # render DPI (higher = sharper but slower)
  overlay_color: [1.0, 0.35, 0.0]   # RGB tint for detected regions [0–1]
  overlay_alpha: 0.45
  show_real_time: false    # true → elapsed time label (s/min/h); false → "t = N"
