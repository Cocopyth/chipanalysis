[project]
name = "chipanalysis"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "coco", email = "corentin@bisot.com" }
]
dependencies = [
  # ── Notebook / display ────────────────────────────────────────────────────
  "notebook>=7.0.0",
  "ipympl",
  # ── Core numerics ─────────────────────────────────────────────────────────
  "numpy>=1.23",
  "pandas",
  "scipy",
  # ── Image processing ──────────────────────────────────────────────────────
  "scikit-image",
  "opencv-python",
  "Pillow",                         # PIL — used in video rendering
  # ── Plotting ──────────────────────────────────────────────────────────────
  "matplotlib",
  "seaborn",
  # ── Deep learning ─────────────────────────────────────────────────────────
  "torch>=2.0",                     # UNet pillar / organism detectors
  # ── Video export ──────────────────────────────────────────────────────────
  "moviepy>=2.2.0,<3.0.0",
  "imageio-ffmpeg>=0.6.0,<0.7.0",
  # ── CZI file reading ──────────────────────────────────────────────────────
  "aicspylibczi",
  # ── Batch / config ────────────────────────────────────────────────────────
  "PyYAML",                         # yaml config in batch_chip_dynamics.py
  "openpyxl",                       # Excel manifest reading
  "scikit-learn",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"